<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Operations ledger with audited events">
  <defs>
    <linearGradient id="sup-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7965F5"/>
      <stop offset="1" stop-color="#4436A5"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="#FCFCFD"/>
  <g stroke="#EEF0F5" stroke-width="1">
    <path d="M80 0V420M160 0V420M240 0V420M320 0V420M400 0V420M480 0V420M560 0V420"/>
    <path d="M0 70H640M0 140H640M0 210H640M0 280H640M0 350H640"/>
  </g>

  <!-- ledger panel -->
  <g transform="translate(128 60)">
    <rect width="384" height="300" rx="18" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1.5"/>
    <rect x="26" y="26" width="180" height="12" rx="6" fill="#101828" opacity="0.85"/>
    <rect x="26" y="48" width="110" height="8" rx="4" fill="#E8EAF0"/>

    <!-- ledger rows -->
    <g transform="translate(26 84)">
      <rect width="332" height="46" rx="10" fill="#F8F9FC"/>
      <circle cx="22" cy="23" r="7" fill="url(#sup-accent)"/>
      <rect x="42" y="12" width="130" height="9" rx="4.5" fill="#344054"/>
      <rect x="42" y="27" width="88" height="7" rx="3.5" fill="#E8EAF0"/>
      <rect x="252" y="15" width="62" height="16" rx="8" fill="#ECE9FF"/>
      <rect x="260" y="19" width="46" height="8" rx="4" fill="#6552E8"/>

      <rect y="56" width="332" height="46" rx="10" fill="#F8F9FC"/>
      <circle cx="22" cy="79" r="7" fill="#0E9F6E"/>
      <rect x="42" y="68" width="150" height="9" rx="4.5" fill="#344054"/>
      <rect x="42" y="83" width="76" height="7" rx="3.5" fill="#E8EAF0"/>
      <rect x="252" y="71" width="62" height="16" rx="8" fill="#ECFDF5"/>
      <rect x="260" y="75" width="46" height="8" rx="4" fill="#0E9F6E"/>

      <rect y="112" width="332" height="46" rx="10" fill="#F8F9FC"/>
      <circle cx="22" cy="135" r="7" fill="#D97706"/>
      <rect x="42" y="124" width="118" height="9" rx="4.5" fill="#344054"/>
      <rect x="42" y="139" width="92" height="7" rx="3.5" fill="#E8EAF0"/>
      <rect x="252" y="127" width="62" height="16" rx="8" fill="#FFFBEB"/>
      <rect x="260" y="131" width="46" height="8" rx="4" fill="#D97706"/>
    </g>
  </g>

  <!-- retry-safe loop badge -->
  <g transform="translate(472 316)">
    <rect width="112" height="52" rx="26" fill="#FFFFFF" stroke="#C0B7FF" stroke-width="1.5"/>
    <path d="M30 26 a10 10 0 1 1 3 -7" stroke="#6552E8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M36 12 v8 h-8" stroke="#6552E8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="18" width="44" height="7" rx="3.5" fill="#C0B7FF"/>
    <rect x="52" y="29" width="32" height="7" rx="3.5" fill="#E8EAF0"/>
  </g>

  <!-- audit seal -->
  <g transform="translate(72 300)">
    <circle r="30" fill="#F4F3FF" stroke="#9C8BFF" stroke-width="2"/>
    <circle r="18" fill="none" stroke="#6552E8" stroke-width="2.5" stroke-dasharray="4 5"/>
    <circle r="6" fill="#6552E8"/>
  </g>
</svg>
