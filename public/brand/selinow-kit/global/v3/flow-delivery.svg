<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Automatic digital delivery with masked license keys">
  <defs>
    <linearGradient id="del-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7965F5"/>
      <stop offset="1" stop-color="#4436A5"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="#FCFCFD"/>
  <g stroke="#EEF0F5" stroke-width="1">
    <path d="M80 0V420M160 0V420M240 0V420M320 0V420M400 0V420M480 0V420M560 0V420"/>
    <path d="M0 70H640M0 140H640M0 210H640M0 280H640M0 350H640"/>
  </g>

  <!-- delivery console -->
  <g transform="translate(108 72)">
    <rect width="424" height="276" rx="18" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1.5"/>
    <rect width="424" height="48" rx="18" fill="#F6F7FA"/>
    <rect y="30" width="424" height="18" fill="#F6F7FA"/>
    <circle cx="26" cy="24" r="5" fill="#DCD7FF"/>
    <circle cx="44" cy="24" r="5" fill="#C0B7FF"/>
    <circle cx="62" cy="24" r="5" fill="#7965F5"/>

    <!-- license key card -->
    <g transform="translate(28 74)">
      <rect width="368" height="84" rx="14" fill="#F8F9FC" stroke="#E8EAF0"/>
      <rect x="18" y="18" width="26" height="26" rx="7" fill="url(#del-accent)"/>
      <path d="M25 31 l4 4 7 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="58" y="22" width="150" height="10" rx="5" fill="#344054"/>
      <rect x="58" y="40" width="98" height="8" rx="4" fill="#E8EAF0"/>
      <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#5140C9">
        <text x="18" y="72">SLN4-XXXX-••••-••••</text>
      </g>
      <rect x="286" y="52" width="66" height="22" rx="11" fill="#ECE9FF"/>
      <rect x="296" y="59" width="46" height="8" rx="4" fill="#6552E8"/>
    </g>

    <!-- delivery rows -->
    <g transform="translate(28 180)">
      <rect width="368" height="34" rx="9" fill="#F8F9FC"/>
      <circle cx="20" cy="17" r="5" fill="#0E9F6E"/>
      <rect x="36" y="12" width="120" height="9" rx="4.5" fill="#D9DCE5"/>
      <rect x="300" y="12" width="48" height="9" rx="4.5" fill="#A7F3D0"/>

      <rect y="42" width="368" height="34" rx="9" fill="#F8F9FC"/>
      <circle cx="20" cy="59" r="5" fill="#0E9F6E"/>
      <rect x="36" y="54" width="96" height="9" rx="4.5" fill="#D9DCE5"/>
      <rect x="300" y="54" width="48" height="9" rx="4.5" fill="#A7F3D0"/>
    </g>
  </g>

  <!-- outbound arrow with packet -->
  <g transform="translate(500 300)">
    <circle r="30" fill="#ECE9FF"/>
    <path d="M-13 -1 h20 M1 -10 l10 9 -10 9" stroke="#5140C9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- buyer device -->
  <g transform="translate(76 268)">
    <rect width="92" height="64" rx="12" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="1.5"/>
    <rect x="12" y="12" width="46" height="8" rx="4" fill="#C0B7FF"/>
    <rect x="12" y="28" width="64" height="6" rx="3" fill="#E8EAF0"/>
    <rect x="12" y="42" width="52" height="6" rx="3" fill="#E8EAF0"/>
  </g>

  <!-- dashed delivery path -->
  <path d="M170 300 C 260 350 380 350 468 302" stroke="#9C8BFF" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
</svg>
