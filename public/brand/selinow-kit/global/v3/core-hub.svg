<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Selinow commerce core">
  <defs>
    <linearGradient id="hub-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7965F5"/>
      <stop offset="1" stop-color="#4436A5"/>
    </linearGradient>
  </defs>
  <!-- orbit ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#DCD7FF" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
  <!-- core -->
  <rect x="20" y="20" width="88" height="88" rx="24" fill="url(#hub-fill)"/>
  <rect x="20" y="20" width="88" height="88" rx="24" fill="none" stroke="#3A3183" stroke-width="2"/>
  <!-- flow marks -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <path d="M42 44 h20"/>
    <path d="M42 60 h44"/>
    <path d="M42 76 h28"/>
  </g>
  <!-- live node -->
  <circle cx="92" cy="36" r="11" fill="#FFFFFF"/>
  <circle cx="92" cy="36" r="4.5" fill="#0E9F6E"/>
  <!-- satellite nodes -->
  <g fill="#ECE9FF" stroke="#9C8BFF" stroke-width="2">
    <circle cx="14" cy="70" r="8"/>
    <circle cx="112" cy="86" r="8"/>
  </g>
</svg>
