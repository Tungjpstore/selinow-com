<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Channel network wired into one commerce core">
  <defs>
    <linearGradient id="net-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7965F5"/>
      <stop offset="1" stop-color="#4436A5"/>
    </linearGradient>
    <radialGradient id="net-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7965F5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7965F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="420" fill="#FCFCFD"/>
  <g stroke="#EEF0F5" stroke-width="1">
    <path d="M80 0V420M160 0V420M240 0V420M320 0V420M400 0V420M480 0V420M560 0V420"/>
    <path d="M0 70H640M0 140H640M0 210H640M0 280H640M0 350H640"/>
  </g>
  <circle cx="320" cy="210" r="150" fill="url(#net-glow)"/>

  <!-- spokes -->
  <g stroke="#C0B7FF" stroke-width="2" fill="none">
    <path d="M320 210 L142 96"/>
    <path d="M320 210 L498 96"/>
    <path d="M320 210 L110 264"/>
    <path d="M320 210 L530 264"/>
    <path d="M320 210 L236 356"/>
    <path d="M320 210 L404 356"/>
  </g>
  <g stroke="#7965F5" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M320 210 L142 96"/>
    <path d="M320 210 L498 96"/>
  </g>

  <!-- core node -->
  <g transform="translate(320 210)">
    <rect x="-58" y="-58" width="116" height="116" rx="26" fill="url(#net-core)"/>
    <rect x="-58" y="-58" width="116" height="116" rx="26" fill="none" stroke="#4436A5" stroke-width="2"/>
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M-18 -20 L2 -20 M-18 -8 L18 -8 M-18 4 L10 4 M-18 16 L-2 16" transform="translate(0 -2)"/>
    </g>
    <circle cx="34" cy="-34" r="12" fill="#FFFFFF"/>
    <circle cx="34" cy="-34" r="5" fill="#0E9F6E"/>
  </g>

  <!-- channel nodes -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700">
    <g transform="translate(142 96)">
      <circle r="30" fill="#FFFFFF" stroke="#C0B7FF" stroke-width="2"/>
      <path d="M-9 4 L9 -8 L3 0 L9 0 L-9 10 L-5 1 Z" fill="#6552E8"/>
      <text y="48" text-anchor="middle" fill="#344054">Telegram</text>
    </g>
    <g transform="translate(498 96)">
      <circle r="30" fill="#FFFFFF" stroke="#D9DCE5" stroke-width="2"/>
      <g stroke="#5140C9" stroke-width="2.5" fill="none">
        <circle r="11"/>
        <path d="M-16 0a16 16 0 0 0 32 0M-11 0 L-4 -7 M11 0 L4 -7" stroke-linecap="round"/>
      </g>
      <text y="48" text-anchor="middle" fill="#344054">Website</text>
    </g>
    <g transform="translate(110 264)">
      <circle r="26" fill="#FFFFFF" stroke="#E8EAF0" stroke-width="2"/>
      <rect x="-9" y="-7" width="18" height="14" rx="4" fill="none" stroke="#9C8BFF" stroke-width="2.5"/>
      <text y="42" text-anchor="middle" fill="#98A2B3">Zalo</text>
    </g>
    <g transform="translate(530 264)">
      <circle r="26" fill="#FFFFFF" stroke="#E8EAF0" stroke-width="2"/>
      <path d="M-8 -6 L8 6 M8 -6 L-8 6" stroke="#9C8BFF" stroke-width="3" stroke-linecap="round"/>
      <text y="42" text-anchor="middle" fill="#98A2B3">API</text>
    </g>
    <g transform="translate(236 356)">
      <circle r="26" fill="#FFFFFF" stroke="#E8EAF0" stroke-width="2"/>
      <path d="M-10 -7 h20 v10 a7 7 0 0 1 -7 7 h-7 l-6 5 v-5 a7 7 0 0 1 -7 -7 Z" fill="none" stroke="#9C8BFF" stroke-width="2.5" stroke-linejoin="round"/>
      <text y="44" text-anchor="middle" fill="#98A2B3">Chat</text>
    </g>
    <g transform="translate(404 356)">
      <circle r="26" fill="#FFFFFF" stroke="#E8EAF0" stroke-width="2"/>
      <path d="M-9 5 L-3 -3 L2 1 L9 -6" stroke="#9C8BFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="44" text-anchor="middle" fill="#98A2B3">Signals</text>
    </g>
  </g>
</svg>
